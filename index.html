<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EcoBin - Smart Eco-Tourism Platform</title>
<style>
        /* ===== SYSTEM FONTS (No external downloads) ===== */
        :root {
            --primary-green: #10B981;
            --dark-green: #047857;
            --light-green: #D1FAE5;
            --accent-teal: #14B8A6;
            --earth-brown: #92400E;
            --ocean-blue: #0EA5E9;
            --deep-blue: #0369A1;
            --card-bg: #ffffff;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --gradient-hero: linear-gradient(135deg, #047857 0%, #059669 30%, #10B981 60%, #0EA5E9 100%);
            --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
            background: #F0FDF4;
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        body[dir="rtl"] { font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif; }

        /* ===== INLINE SVG ICONS ===== */
        .icon { width: 1em; height: 1em; display: inline-block; vertical-align: middle; fill: currentColor; }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(16,185,129,0.08);
            transition: all 0.3s ease;
        }
        .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.08); padding: 8px 20px; }

        .logo { 
            display: flex; align-items: center; gap: 8px; 
            font-weight: 800; font-size: 1.4rem; color: var(--dark-green); 
            text-decoration: none; 
        }
        .logo-icon { 
            width: 32px; height: 32px; 
            background: var(--gradient-hero); 
            border-radius: 8px; 
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1rem;
        }

        .nav-links { display: flex; gap: 4px; list-style: none; }
        .nav-links a { 
            text-decoration: none; color: var(--text-dark); 
            font-weight: 500; font-size: 0.85rem; 
            padding: 6px 14px; border-radius: 10px; 
            transition: all 0.2s ease; 
        }
        .nav-links a:hover, .nav-links a.active { 
            background: var(--light-green); color: var(--dark-green); 
        }

        .lang-switch { display: flex; gap: 6px; }
        .lang-btn { 
            padding: 5px 12px; border: 2px solid var(--primary-green); 
            background: transparent; color: var(--primary-green); 
            border-radius: 16px; font-weight: 600; font-size: 0.75rem; 
            cursor: pointer; transition: all 0.2s ease; 
        }
        .lang-btn.active { background: var(--primary-green); color: white; }
        .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.3rem; color: var(--dark-green); cursor: pointer; }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            position: relative; padding: 90px 20px 50px;
            background: var(--gradient-hero); overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.08) 0%, transparent 40%);
        }
        .hero-content { text-align: center; color: white; max-width: 800px; z-index: 2; position: relative; }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            padding: 6px 16px; border-radius: 50px; font-size: 0.8rem; font-weight: 500;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2);
        }
        .hero-badge::before { content: "🌿"; }

        .hero h1 { 
            font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 900; 
            line-height: 1.1; margin-bottom: 16px; 
            text-shadow: 0 2px 20px rgba(0,0,0,0.15); 
        }
        .hero h1 span { color: #FEF3C7; }
        .hero p { 
            font-size: clamp(0.95rem, 2vw, 1.1rem); opacity: 0.92; 
            margin-bottom: 32px; max-width: 550px; 
            margin-left: auto; margin-right: auto; line-height: 1.6; 
        }

        .hero-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 32px; flex-wrap: wrap; }
        .hero-stat { text-align: center; }
        .hero-stat-number { font-size: 2.2rem; font-weight: 900; display: block; }
        .hero-stat-label { font-size: 0.8rem; opacity: 0.85; font-weight: 500; }

        .hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { 
            padding: 12px 28px; border-radius: 14px; font-weight: 600; 
            font-size: 0.95rem; cursor: pointer; transition: all 0.25s ease; 
            text-decoration: none; display: inline-flex; align-items: center; gap: 6px; 
            border: none; 
        }
        .btn-primary { background: white; color: var(--dark-green); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.2); }
        .btn-secondary { background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.25); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        /* 3D BIN - Pure CSS */
        /* ===== SMART BIN IMAGE VISUAL ===== */
        .bin-image-wrap { 
            position: absolute; 
            right: 5%; 
            top: 55%; 
            transform: translateY(-50%); 
            width: 48%; 
            max-width: 600px;
            display: none; 
            z-index: 2;
        }
        @media(min-width:1100px){ .bin-image-wrap{ display:block; } }
        body[dir="rtl"] .bin-image-wrap { right: auto; left: 5%; }

        .bin-img-show {
            width: 100%;
            height: auto;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25), 0 4px 12px rgba(16,185,129,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            animation: binImgFloat 6s ease-in-out infinite;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            padding: 6px;
        }

        @keyframes binImgFloat { 
            0%, 100% { transform: translateY(0) scale(1); } 
            50% { transform: translateY(-12px) scale(1.01); } 
        }

        /* تعديل محتوى الهيرو ليتناسب مع حجم الصورة الجديد */
        @media(min-width:1100px){
            .hero-content { 
                text-align: left; 
                margin-right: auto; 
                margin-left: 8%;
                max-width: 500px; 
            }
            body[dir="rtl"] .hero-content { 
                text-align: right; 
                margin-left: auto; 
                margin-right: 8%; 
            }
            .hero-cta, .hero-stats { justify-content: flex-start; }
            body[dir="rtl"] .hero-cta, body[dir="rtl"] .hero-stats { justify-content: flex-start; }
        }

        /* ===== SECTIONS ===== */
        section { padding: 60px 20px; position: relative; }
        .section-header { text-align: center; margin-bottom: 40px; }
        .section-header h2 { font-size: clamp(1.8rem, 3.5vw, 2.6rem); font-weight: 800; color: var(--dark-green); margin-bottom: 12px; }
        .section-header p { color: var(--text-muted); font-size: 1rem; max-width: 520px; margin: 0 auto; line-height: 1.6; }
        .section-badge { 
            display: inline-flex; align-items: center; gap: 5px;
            background: var(--light-green); color: var(--dark-green); 
            padding: 5px 14px; border-radius: 50px; 
            font-size: 0.75rem; font-weight: 600; margin-bottom: 12px; 
        }

        /* ===== DASHBOARD - CSS BAR CHARTS ===== */
        .dashboard-section { background: linear-gradient(180deg, #F0FDF4, #ECFDF5); }
        .dashboard-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 20px; max-width: 1300px; margin: 0 auto; 
        }
        .dash-card { 
            background: var(--card-bg); border-radius: 20px; padding: 24px; 
            box-shadow: var(--shadow-soft); border: 1px solid rgba(16,185,129,0.06);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .dash-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
        .dash-card::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; 
            background: var(--gradient-hero); 
        }
        .dash-icon { 
            width: 44px; height: 44px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.3rem; margin-bottom: 12px; 
        }
        .dash-icon.green { background: var(--light-green); }
        .dash-icon.blue { background: #DBEAFE; }
        .dash-icon.orange { background: #FEF3C7; }
        .dash-icon.red { background: #FEE2E2; }
        .dash-title { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .dash-value { font-size: 2rem; font-weight: 900; color: var(--dark-green); margin-bottom: 6px; line-height: 1; }
        .dash-value.small { font-size: 1.5rem; }
        .dash-change { 
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 0.8rem; font-weight: 600; padding: 3px 8px; 
            border-radius: 6px; background: var(--light-green); color: var(--dark-green); 
        }

        /* CSS Mini Chart */
        .mini-chart { margin-top: 16px; height: 50px; display: flex; align-items: flex-end; gap: 4px; }
        .mini-bar { 
            flex: 1; border-radius: 3px 3px 0 0; 
            transition: height 0.5s ease; min-height: 4px;
        }
        .mini-bar.g { background: linear-gradient(180deg, #10B981, #059669); }
        .mini-bar.b { background: linear-gradient(180deg, #0EA5E9, #0284C7); }
        .mini-bar.o { background: linear-gradient(180deg, #F59E0B, #D97706); }

        /* ===== BINS ===== */
        .bins-section { background: linear-gradient(180deg, #ECFDF5, #F0F9FF); }
        .bins-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; max-width: 1300px; margin: 0 auto; 
        }
        .bin-card { 
            background: var(--card-bg); border-radius: 20px; overflow: hidden; 
            box-shadow: var(--shadow-soft); border: 1px solid rgba(16,185,129,0.06);
            transition: all 0.3s ease;
        }
        .bin-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .bin-head { 
            padding: 16px 20px; background: linear-gradient(135deg, var(--dark-green), var(--primary-green)); 
            color: white; display: flex; justify-content: space-between; align-items: center;
        }
        body[dir="rtl"] .bin-head { flex-direction: row-reverse; }
        .bin-loc { font-weight: 700; font-size: 1rem; }
        .bin-stat { 
            padding: 3px 10px; border-radius: 16px; font-size: 0.7rem; font-weight: 600; 
            background: rgba(255,255,255,0.2); 
        }
        .bin-body { padding: 20px; }
        .bin-visual { display: flex; justify-content: center; margin-bottom: 16px; }
        .bin-mini { 
            width: 80px; height: 110px; background: linear-gradient(135deg, #E5E7EB, #D1D5DB); 
            border-radius: 8px 8px 14px 14px; position: relative; overflow: hidden;
        }
        .bin-mini-f { 
            position: absolute; bottom: 0; left: 0; right: 0; border-radius: 0 0 12px 12px; 
            transition: height 0.8s ease; 
        }
        .bin-mini-f.pl { background: linear-gradient(180deg, #60A5FA, #3B82F6); }
        .bin-mini-f.gl { background: linear-gradient(180deg, #34D399, #10B981); }
        .bin-mini-f.mt { background: linear-gradient(180deg, #FBBF24, #F59E0B); }

        .bin-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
        .bin-m { text-align: center; padding: 10px; background: #F9FAFB; border-radius: 10px; }
        .bin-mv { font-size: 1.1rem; font-weight: 800; color: var(--dark-green); }
        .bin-ml { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

        .prog { margin-bottom: 6px; }
        .prog-l { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; font-weight: 500; }
        body[dir="rtl"] .prog-l { flex-direction: row-reverse; }
        .prog-b { height: 8px; background: #E5E7EB; border-radius: 4px; overflow: hidden; }
        .prog-f { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
        .prog-f.pl { background: linear-gradient(90deg, #60A5FA, #3B82F6); }
        .prog-f.gl { background: linear-gradient(90deg, #34D399, #10B981); }
        .prog-f.mt { background: linear-gradient(90deg, #FBBF24, #F59E0B); }

        /* ===== SUPPLIERS & ORDERS ===== */
        .split-section { background: linear-gradient(180deg, #F0F9FF, #F0FDF4); }
        .split-wrap { 
            max-width: 1300px; margin: 0 auto; display: grid; 
            grid-template-columns: 1fr; gap: 24px; 
        }
        @media(min-width:1024px){ .split-wrap{ grid-template-columns: 1fr 1fr; } }

        .panel { 
            background: var(--card-bg); border-radius: 20px; overflow: hidden; 
            box-shadow: var(--shadow-soft); border: 1px solid rgba(16,185,129,0.06);
        }
        .panel-head { 
            padding: 20px 24px; display: flex; justify-content: space-between; align-items: center;
        }
        body[dir="rtl"] .panel-head { flex-direction: row-reverse; }
        .panel-head.sup { background: linear-gradient(135deg, #0EA5E9, #0284C7); color: white; }
        .panel-head.ord { background: linear-gradient(135deg, #059669, #047857); color: white; }
        .panel-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .panel-badge { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 16px; font-size: 0.75rem; font-weight: 600; }
        .panel-body { padding: 20px; }

        /* Table */
        .data-t { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .data-t th { 
            text-align: left; padding: 10px 12px; font-size: 0.7rem; font-weight: 600; 
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; 
            border-bottom: 2px solid #E5E7EB; 
        }
        body[dir="rtl"] .data-t th { text-align: right; }
        .data-t td { padding: 12px; border-bottom: 1px solid #F3F4F6; }
        .data-t tr:hover td { background: #F9FAFB; }

        .sup-info { display: flex; align-items: center; gap: 10px; }
        body[dir="rtl"] .sup-info { flex-direction: row-reverse; }
        .sup-av { 
            width: 36px; height: 36px; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 700; font-size: 0.8rem; color: white; 
        }
        .sup-n { font-weight: 700; font-size: 0.9rem; }
        .sup-t { font-size: 0.75rem; color: var(--text-muted); }

        .qty-b { 
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; 
        }
        .qty-b.ok { background: var(--light-green); color: var(--dark-green); }
        .qty-b.low { background: #FEF3C7; color: var(--earth-brown); }
        .qty-b.crit { background: #FEE2E2; color: var(--danger); }

        .act-btn { 
            padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; 
            cursor: pointer; border: none; transition: all 0.2s ease; 
        }
        .act-btn.ord { background: var(--primary-green); color: white; }
        .act-btn.ord:hover { background: var(--dark-green); transform: scale(1.05); }
        .act-btn.done { background: #E5E7EB; color: var(--text-muted); cursor: not-allowed; }

        /* Orders */
        .ord-card { 
            background: #F9FAFB; border-radius: 14px; padding: 16px; 
            margin-bottom: 12px; border: 1px solid #E5E7EB; transition: all 0.2s ease;
        }
        .ord-card:hover { border-color: var(--primary-green); }
        .ord-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        body[dir="rtl"] .ord-h { flex-direction: row-reverse; }
        .ord-id { font-weight: 700; font-size: 0.9rem; }
        .ord-st { 
            padding: 3px 10px; border-radius: 16px; font-size: 0.7rem; font-weight: 600; 
        }
        .ord-st.pend { background: #FEF3C7; color: var(--earth-brown); }
        .ord-st.proc { background: #DBEAFE; color: var(--deep-blue); }
        .ord-st.comp { background: var(--light-green); color: var(--dark-green); }
        .ord-dets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; font-size: 0.82rem; color: var(--text-muted); }
        .ord-dets span { color: var(--text-dark); font-weight: 600; }
        .ord-prog { display: flex; align-items: center; gap: 6px; }
        body[dir="rtl"] .ord-prog { flex-direction: row-reverse; }
        .ord-prog-b { flex: 1; height: 6px; background: #E5E7EB; border-radius: 3px; overflow: hidden; }
        .ord-prog-f { height: 100%; background: linear-gradient(90deg, var(--primary-green), var(--accent-teal)); border-radius: 3px; transition: width 0.8s ease; }
        .ord-prog-t { font-size: 0.75rem; font-weight: 600; color: var(--dark-green); min-width: 35px; }

        /* ===== REWARDS ===== */
        .rewards-section { background: linear-gradient(180deg, #F0FDF4, #FEF3C7); }
        .rewards-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 20px; max-width: 1100px; margin: 0 auto; 
        }
        .rew-card { 
            background: var(--card-bg); border-radius: 20px; overflow: hidden; 
            box-shadow: var(--shadow-soft); border: 1px solid rgba(16,185,129,0.06);
            transition: all 0.3s ease;
        }
        .rew-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
        .rew-img { 
            height: 140px; display: flex; align-items: center; justify-content: center; 
            font-size: 3rem; position: relative; 
        }
        .rew-body { padding: 20px; }
        .rew-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
        .rew-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }
        .rew-pts { display: flex; align-items: center; justify-content: space-between; }
        body[dir="rtl"] .rew-pts { flex-direction: row-reverse; }
        .pts-tag { 
            display: inline-flex; align-items: center; gap: 4px;
            background: linear-gradient(135deg, #FEF3C7, #FDE68A); 
            color: var(--earth-brown); padding: 6px 12px; 
            border-radius: 10px; font-weight: 700; font-size: 0.85rem; 
        }
        .rew-btn { 
            padding: 8px 16px; background: var(--primary-green); color: white; 
            border: none; border-radius: 10px; font-weight: 600; font-size: 0.85rem; 
            cursor: pointer; transition: all 0.2s ease; 
        }
        .rew-btn:hover { background: var(--dark-green); transform: scale(1.05); }
        .rew-btn:disabled { background: #E5E7EB; color: var(--text-muted); cursor: not-allowed; transform: none; }

        /* ===== IMPACT ===== */
        .impact-section { background: linear-gradient(180deg, #FEF3C7, #F0FDF4); }
        .imp-wrap { max-width: 1100px; margin: 0 auto; }
        .imp-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; margin-bottom: 32px; 
        }
        .imp-card { 
            background: var(--card-bg); border-radius: 20px; padding: 28px; 
            text-align: center; box-shadow: var(--shadow-soft); 
            border: 1px solid rgba(16,185,129,0.06); position: relative; overflow: hidden;
        }
        .imp-card::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; 
        }
        .imp-card.pl::before { background: linear-gradient(90deg, #60A5FA, #3B82F6); }
        .imp-card.gl::before { background: linear-gradient(90deg, #34D399, #10B981); }
        .imp-card.mt::before { background: linear-gradient(90deg, #FBBF24, #F59E0B); }
        .imp-card.en::before { background: linear-gradient(90deg, #A78BFA, #8B5CF6); }
        .imp-icon { font-size: 2.2rem; margin-bottom: 14px; }
        .imp-val { font-size: 2.4rem; font-weight: 900; color: var(--dark-green); margin-bottom: 4px; }
        .imp-unit { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
        .imp-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

        /* CSS Impact Chart */
        .imp-chart { 
            background: var(--card-bg); border-radius: 20px; padding: 28px; 
            box-shadow: var(--shadow-soft); border: 1px solid rgba(16,185,129,0.06);
        }
        .imp-chart h3 { font-size: 1.1rem; font-weight: 700; color: var(--dark-green); margin-bottom: 20px; text-align: center; }
        .chart-grid { display: flex; align-items: flex-end; gap: 8px; height: 180px; padding: 0 10px; }
        .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .chart-bars { display: flex; align-items: flex-end; gap: 3px; width: 100%; height: 140px; }
        .c-bar { flex: 1; border-radius: 4px 4px 0 0; transition: height 0.5s ease; }
        .c-bar.pl { background: #3B82F6; }
        .c-bar.gl { background: #10B981; }
        .c-bar.mt { background: #F59E0B; }
        .chart-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

        /* ===== FOOTER ===== */
        .footer { 
            background: linear-gradient(180deg, #064E3B, #022C22); 
            color: white; padding: 50px 20px 24px; 
        }
        .foot-wrap { 
            max-width: 1100px; margin: 0 auto; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; margin-bottom: 32px; 
        }
        .foot-brand .logo { color: white; margin-bottom: 12px; }
        .foot-brand p { opacity: 0.75; line-height: 1.6; font-size: 0.9rem; }
        .foot-links h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 16px; color: var(--primary-green); }
        .foot-links ul { list-style: none; }
        .foot-links li { margin-bottom: 10px; }
        .foot-links a { color: rgba(255,255,255,0.65); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
        .foot-links a:hover { color: white; }
        .foot-bot { text-align: center; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); opacity: 0.55; font-size: 0.8rem; }

        /* ===== ANIMATIONS ===== */
        .fade-in { opacity: 0; transform: translateY(24px); transition: all 0.6s ease; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #F3F4F6; }
        ::-webkit-scrollbar-thumb { background: var(--primary-green); border-radius: 3px; }

        /* ===== RESPONSIVE ===== */
        @media(max-width:768px) {
            .nav-links { display: none; }
            .mobile-menu-btn { display: block; }
            .hero-stats { gap: 16px; }
            .hero-stat-number { font-size: 1.6rem; }
            section { padding: 40px 16px; }
            .dash-card, .bin-card, .rew-card, .imp-card { border-radius: 16px; }
            .split-wrap, .rewards-grid, .imp-grid, .foot-wrap { grid-template-columns: 1fr; }
        }

        /* ===== TOAST ===== */
        .toast-wrap { 
            position: fixed; top: 80px; right: 20px; z-index: 9998; 
            display: flex; flex-direction: column; gap: 10px; 
        }
        body[dir="rtl"] .toast-wrap { right: auto; left: 20px; }
        .toast { 
            background: white; border-radius: 14px; padding: 14px 20px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.12); display: flex; 
            align-items: center; gap: 10px; min-width: 280px; 
            transform: translateX(350px); transition: transform 0.35s ease; 
            border-left: 3px solid var(--primary-green); 
        }
        body[dir="rtl"] .toast { border-left: none; border-right: 3px solid var(--primary-green); transform: translateX(-350px); }
        .toast.show { transform: translateX(0); }
        .toast-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--light-green); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .toast-txt h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
        .toast-txt p { font-size: 0.8rem; color: var(--text-muted); }

        /* ===== LOADING ===== */
        .load-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--gradient-hero); z-index: 9999;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .load-overlay.hide { opacity: 0; visibility: hidden; }
        .load-spin { 
            width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.25); 
            border-top-color: white; border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .load-txt { color: white; font-size: 1rem; font-weight: 600; }

  DB.orders.unshift({id:'ST-'+String(DB.n++).padStart(3,'0'),sid:+sid,items,total:+(s-disc*s/sub).toFixed(2),status:'pending',date:new Date().toISOString().slice(0,10)})});
 DB.points-=disc*100;DB.cart=[];save();sync();showToast(t('order_done'),t('order_done_msg'));renderAll()}
function setStatus(id,st){sync();const o=DB.orders.find(x=>x.id===id);if(!o)return;
 if(st==='cancelled')o.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.pid);if(p)p.stock+=i.qty});
 o.status=st;save();renderAll()}
function setProd(id,f,v){sync();const p=DB.products.find(x=>x.id===id);if(p){p[f]=Math.max(0,+v||0);save();renderAll()}}
function setProdState(id,st){sync();const p=DB.products.find(x=>x.id===id);if(p){p.st=st;save();renderAll()}}
function redeemReward(rid){sync();const rw=rewardsData.find(r=>r.id===rid);if(!rw||DB.points<rw.points)return;
 DB.points-=rw.points;save();sync();showToast(t('reward_redeemed'),t('reward_success',{title:rw.title[currentLang],points:userPoints.toLocaleString()}));renderAll()}

const NAVS={home:[],user:[['#user','nav_home'],['#store','nav_store'],['#scanner','nav_scan'],['#user/points','nav_points'],['#cart','nav_cart'],['#user/rewards','nav_rewards'],['#user/impact','nav_impact']],
supplier:[['#supplier','nav_home'],['#supplier/products','nav_products'],['#supplier/orders','nav_orders']],

 <div class="rew-body"><div class="rew-title">${pn(p)}</div><div class="rew-desc">${t(p.material.toLowerCase())} · ${sup(p.sid).name[currentLang]}</div>
 <div class="rew-pts"><span class="pts-tag">${money(p.price)}</span><button class="rew-btn" ${p.stock<1?'disabled':''} onclick="addToCart(${p.id})">${p.stock<1?t('sold_out'):'🛒 '+t('add_cart')}</button></div>
 <div class="stk">${p.stock} ${t('in_stock')}</div></div></div>`).join('')||`<p class="empty">${t('no_products')}</p>`}


function pageCart(){const L=DB.cart.map(c=>({c,p:DB.products.find(x=>x.id===c.pid)})).filter(x=>x.p);
 const sub=L.reduce((a,x)=>a+x.p.price*x.c.qty,0),maxd=Math.min(Math.floor(sub),Math.floor(DB.points/100)),chk=$('usePts')&&$('usePts').checked;
 $('cartBox').innerHTML=L.length?L.map(({c,p})=>`<div class="cartline"><span class="ci">${p.icon}</span><div class="cn">${pn(p)}<div class="sup-t">${sup(p.sid).name[currentLang]} · ${money(p.price)}</div></div>
 <div class="qtyc"><button onclick="setQty(${p.id},-1)">−</button>${c.qty}<button onclick="setQty(${p.id},1)">+</button></div><button class="act-btn no" onclick="setQty(${p.id},-99)">✕</button></div>`).join('')+
 `<div class="sum"><div><span>${t('subtotal')}</span><span>${money(sub)}</span></div><label><input type="checkbox" id="usePts" ${chk?'checked':''} ${maxd?'':'disabled'} onchange="renderAll()"> ${t('use_points',{n:maxd*100,d:maxd})}</label>
 <div class="tot"><span>${t('total')}</span><span>${money(sub-(chk?maxd:0))}</span></div></div><button class="act-btn ord" style="width:100%;margin-top:14px;padding:12px" onclick="checkout()">${t('checkout')}</button>`
 :`<p class="empty">${t('cart_empty')} <a href="#store">${t('nav_store')}</a></p>`;
 $('myCount').textContent=DB.orders.length;$('myOrders').innerHTML=DB.orders.map(o=>orderCard(o)).join('')||`<p class="empty">${t('no_orders')}</p>`}


let who=1;try{who=+localStorage.getItem('ecobin_sup')||1}catch(e){}
function setWho(v){who=+v;try{localStorage.setItem('ecobin_sup',v)}catch(e){}renderAll()}
const NEXT={pending:['processing','accept'],processing:['shipped','ship'],shipped:['completed','complete']};
function ACT(o){const n=NEXT[o.status];return n?`<div class="acts"><button class="act-btn ord" onclick="setStatus('${o.id}','${n[0]}')">${t(n[1])}</button>${o.status==='pending'?`<button class="act-btn no" onclick="setStatus('${o.id}','cancelled')">${t('decline')}</button>`:''}</div>`:''}
function addProduct(){const n=$('fn').value.trim(),pr=parseFloat($('fpr').value),s=parseInt($('fs').value);
 if(!n||!(pr>=0)||!(s>=0))return showToast(t('fill_all'),'');sync();
 DB.products.push({id:Date.now()%1e9,sid:who,name:{en:n,ar:$('fa').value.trim()||n},material:$('fm').value,price:pr,stock:s,icon:$('fi').value||'♻️',color:'#D1FAE5',st:'review'});
 save();['fn','fa','fpr','fs','fi'].forEach(i=>$(i).value='');showToast(t('product_added'),n);renderAll()}
function pageSupplier(){const Ps=DB.products.filter(p=>p.sid===who),O=DB.orders.filter(o=>o.sid===who);
 $('who').innerHTML=suppliersData.map(s=>`<option value="${s.id}" ${s.id===who?'selected':''}>${s.name[currentLang]}</option>`).join('');
 const rev=O.filter(o=>o.status==='completed').reduce((a,o)=>a+o.total,0);
 $('kpi').innerHTML=[['🛍',t('products_n'),Ps.length],['⏳',t('pending_n'),O.filter(o=>o.status==='pending').length],['💰',t('revenue'),money(rev)]].map(([i,l,v])=>`<div class="dash-card"><div class="dash-icon green">${i}</div><div class="dash-title">${l}</div><div class="dash-value">${v}</div></div>`).join('');
 $('prodRows').innerHTML=Ps.map(p=>`<tr><td>${p.icon} ${pn(p)}</td><td><input class="num" style="width:75px" type="number" step="0.1" min="0" value="${p.price}" onchange="setProd(${p.id},'price',this.value)"></td>
 <td><input class="num" style="width:75px" type="number" min="0" value="${p.stock}" onchange="setProd(${p.id},'stock',this.value)"></td><td><span class="qty-b ${stCls(p.st)}">${t(p.st)}</span></td></tr>`).join('');
 $('supOrders').innerHTML=O.map(o=>orderCard(o,ACT(o))).join('')||`<p class="empty">${t('no_orders')}</p>`}


function pageAdmin(){$('pc').textContent=DB.products.length;
 $('oc').textContent=DB.orders.length+' · '+money(DB.orders.filter(o=>o.status!=='cancelled').reduce((a,o)=>a+o.total,0));
 $('modRows').innerHTML=DB.products.map(p=>`<tr><td>${p.icon} ${pn(p)}<div class="sup-t">${sup(p.sid).name[currentLang]} · ${money(p.price)}</div></td><td><span class="qty-b ${stCls(p.st)}">${t(p.st)}</span></td>
 <td><button class="act-btn ${p.st==='live'?'no':'ord'}" onclick="setProdState(${p.id},'${p.st==='live'?'blocked':'live'}')">${t(p.st==='live'?'block':p.st==='review'?'approve':'unblock')}</button></td></tr>`).join('');
 $('allOrders').innerHTML=DB.orders.map(o=>orderCard(o)).join('')||`<p class="empty">${t('no_orders')}</p>`}

const RATE={Plastic:10,Glass:6,Metal:12};
function renderPoints(){const L=DB.log,tot=L.reduce((a,x)=>a+x.pts,0),kg=L.reduce((a,x)=>a+x.kg,0);
 $('ptsKpi').innerHTML=[['pl','🪙',DB.points.toLocaleString(),t('points'),t('pts_balance')],['gl','♻',tot.toLocaleString(),t('points'),t('pts_earned')],['mt','⚖',+kg.toFixed(1),'kg',t('pts_kg')],['en','🧾',L.length,'',t('pts_deposits')]].map(([c,i,v,u,l])=>`<div class="imp-card ${c}"><div class="imp-icon">${i}</div><div class="imp-val">${v}</div><div class="imp-unit">${u}</div><div class="imp-label">${l}</div></div>`).join('');
 $('ptsRows').innerHTML=L.slice(0,10).map(x=>`<tr><td>${x.d}</td><td>${x.loc[currentLang]||x.loc.en}</td><td>${t(x.m.toLowerCase())}</td><td>${x.kg}</td><td><b>+${x.pts}</b></td></tr>`).join('')||`<tr><td colspan="5" class="empty">${t('pts_empty')}</td></tr>`}
function toggleBinForm(){const f=$('binForm');f.style.display=f.style.display==='none'?'block':'none'}
function addBin(){const en=$('bn').value.trim();if(!en)return showToast(t('fill_all'),'');const la=parseFloat($('blat').value),lo=parseFloat($('blng').value);sync();
 const id='BIN-'+String(binsData.length+1).padStart(3,'0');
 DB.bins.push({id,location:{en,ar:$('ba').value.trim()||en},status:'Active',fillLevel:0,plastic:0,glass:0,metal:0,temp:+$('bt').value||25,lat:isNaN(la)?null:la,lng:isNaN(lo)?null:lo});
 save();sync();['bn','ba','bt','blat','blng'].forEach(i=>$(i).value='');$('binForm').style.display='none';showToast(t('bin_added'),id);renderAll();showQR(id)}
function showQR(id){const b=binsData.find(x=>x.id===id);if(!b)return;
 const pl=btoa(unescape(encodeURIComponent(JSON.stringify({n:b.location.en,a:b.location.ar,la:b.lat,lo:b.lng})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),url=location.href.split('#')[0]+'#scan/'+id+'/'+pl,box=$('qrBox');
 $('qrTitle').textContent=b.location[currentLang]+' · '+id;$('qrUrl').textContent=url;$('qrOpen').href='#scan/'+id+'/'+pl;box.innerHTML='';
 if(typeof QRCode==='undefined'){box.innerHTML='<p class="empty">'+t('qr_offline')+'</p>';$('qrDl').style.display='none'}
 else{$('qrDl').style.display='';new QRCode(box,{text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.L});
  setTimeout(()=>{const c=box.querySelector('canvas');if(c){$('qrDl').href=c.toDataURL('image/png');$('qrDl').download='EcoBin-'+id+'.png'}},150)}
 $('qrModal').classList.add('show')}
function closeQR(){$('qrModal').classList.remove('show')}
function pageScan(){const b=binsData.find(x=>x.id===PARAM);
 $('scanBin').textContent=b?b.location[currentLang]:t('scan_notfound');$('scanId').textContent=b?b.id:'';
 const v=$('sm').value||'Plastic';$('sm').innerHTML=Object.keys(RATE).map(m=>`<option value="${m}">${t(m.toLowerCase())}</option>`).join('');$('sm').value=v;
 $('scanPts').textContent=t('scan_est',{p:Math.round((parseFloat($('sk').value)||0)*RATE[$('sm').value])})}
function deposit(){sync();const b=binsData.find(x=>x.id===PARAM),kg=parseFloat($('sk').value),m=$('sm').value;
 if(!b||!(kg>0))return showToast(t('enter_kg'),'');if(b.status==='Maintenance')return showToast(t('bin_maint'),b.id);
 const pts=Math.round(kg*RATE[m]);DB.points+=pts;DB.log.unshift({d:new Date().toISOString().slice(0,10),bin:b.id,loc:b.location,m,kg,pts});
 b[m.toLowerCase()]+=Math.round(kg);b.fillLevel=Math.min(100,b.fillLevel+Math.ceil(kg*2));
 save();sync();$('sk').value='';showToast(t('deposit_ok'),'+'+pts+' '+t('points'));renderAll()}
let MAP=null,MAPEL=null,MLAYER=null,MSIG='';
function renderMap(){const box=$('mapBox');
 if(typeof L==='undefined'){box.innerHTML='<p class="empty">'+t('map_offline')+'</p>';return}
 if(MAPEL!==box){if(MAP){try{MAP.remove()}catch(e){}}box.innerHTML='';MAP=L.map(box,{scrollWheelZoom:false}).setView([27,30.5],5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(MAP);MLAYER=L.layerGroup().addTo(MAP);MAPEL=box;MSIG='';
  MAP.on('click',e=>{if($('blat')){$('blat').value=e.latlng.lat.toFixed(5);$('blng').value=e.latlng.lng.toFixed(5);showToast(t('map_picked'),$('blat').value+', '+$('blng').value)}});
  setTimeout(()=>MAP.invalidateSize(),250)}
 const bs=binsData.filter(b=>b.lat!=null&&b.lng!=null),sig=currentLang+bs.map(b=>b.id+b.status+b.fillLevel).join();
 if(sig===MSIG)return;MSIG=sig;MLAYER.clearLayers();const pts=[];
 bs.forEach(b=>{const col=b.status==='Maintenance'?'#EF4444':(b.status==='Warning'||b.fillLevel>80)?'#F59E0B':'#10B981';
  L.marker([b.lat,b.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${col}">♻</div>`,iconSize:[34,34],iconAnchor:[17,17]})}).addTo(MLAYER)
  .bindPopup(`<b>${b.location[currentLang]}</b><br>${b.id} · ${t(b.status.toLowerCase())}<br>${t('fill_level')}: ${b.fillLevel}%<div class="acts"><button class="act-btn ord" onclick="showQR('${b.id}')">▦ QR</button></div>`);pts.push([b.lat,b.lng])});
 if(pts.length&&!MAP._fitted){MAP.fitBounds(pts,{padding:[30,30],maxZoom:9});MAP._fitted=1}}
function useMyLoc(){if(!navigator.geolocation)return showToast(t('loc_denied'),'');
 navigator.geolocation.getCurrentPosition(p=>{$('blat').value=p.coords.latitude.toFixed(5);$('blng').value=p.coords.longitude.toFixed(5)},()=>showToast(t('loc_denied'),''))}
function ensureBin(id,x){if(binsData.find(b=>b.id===id))return;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g,'+').replace(/_/g,'/')))));
  sync();DB.bins.push({id,location:{en:o.n,ar:o.a||o.n},status:'Active',fillLevel:0,plastic:0,glass:0,metal:0,temp:25,lat:o.la==null?null:o.la,lng:o.lo==null?null:o.lo});save();sync()}catch(e){}}
let CAM=null,CAMLOOP=0;
async function startCam(){const msg=$('camMsg');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent=t('cam_unsupported');return}
 try{CAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){CAM=null;msg.textContent=t('cam_denied');return}
 const v=$('camVid');v.srcObject=CAM;try{await v.play()}catch(e){}$('camWrap').classList.add('on');msg.textContent=t('cam_scanning');
 const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null,cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const tick=async()=>{if(!CAM)return;
  if(v.readyState>=2&&v.videoWidth){let txt='';
   try{if(det){const r=await det.detect(v);if(r.length)txt=r[0].rawValue}
    else if(typeof jsQR!=='undefined'){const sc=Math.min(1,640/v.videoWidth);cv.width=v.videoWidth*sc;cv.height=v.videoHeight*sc;cx.drawImage(v,0,0,cv.width,cv.height);
     const d=cx.getImageData(0,0,cv.width,cv.height),q=jsQR(d.data,d.width,d.height);if(q)txt=q.data}}catch(e){}
   if(txt&&handleScan(txt))return}
  CAMLOOP=requestAnimationFrame(tick)};tick()}
function stopCam(){if(CAM){CAM.getTracks().forEach(x=>x.stop());CAM=null;cancelAnimationFrame(CAMLOOP)}const w=$('camWrap');if(w)w.classList.remove('on')}
function handleScan(txt){txt=String(txt).trim();let h='';const i=txt.indexOf('#scan/');
 if(i>=0)h=txt.slice(i);else if(/^BIN-\d+$/i.test(txt))h='#scan/'+txt.toUpperCase();
 if(!h){const m=$('camMsg');if(m)m.textContent=t('cam_invalid');return false}
 stopCam();location.hash=h;return true}
function goManual(){const v=$('manId').value.trim();if(v)handleScan(v)}
const VIEWS={scanner:'user',home:'home',user:'user',store:'user',cart:'user',scan:'user',supplier:'supplier',admin:'admin'};
const PAGES={store:pageStore,cart:pageCart,supplier:pageSupplier,admin:pageAdmin,scan:pageScan};
function setNavH(){try{document.documentElement.style.setProperty('--nav-h',$('navbar').offsetHeight+'px')}catch(e){}}
const IO=new IntersectionObserver(e=>e.forEach(n=>n.isIntersecting&&n.target.classList.add('visible')),{threshold:.1});
function route(){const h=decodeURIComponent(location.hash.slice(1)),[v,s,x]=h.split('/');
 if(h&&!VIEWS[v]){const e=$(v);if(e)e.scrollIntoView();return}
 const nv=v||'home';if(nv!=='scanner')stopCam();
 if(nv!==VIEW||!$('app').firstChild){VIEW=nv;PORTAL=VIEWS[nv];$('app').innerHTML='';$('app').appendChild($('tpl-'+nv).content.cloneNode(true));scrollTo(0,0);
  document.querySelectorAll('.fade-in').forEach(x=>IO.observe(x))}
 PARAM=nv==='scan'?(s||''):'';if(nv==='scan'&&s&&x)ensureBin(s,x);renderAll();
 if(s&&nv!=='scan'){const e=$(s);if(e)e.scrollIntoView()}}
document.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>$('loadOverlay').classList.add('hide'),500);
 document.body.dir=currentLang==='ar'?'rtl':'ltr';foot();route();addEventListener('hashchange',route);addEventListener('resize',setNavH);
 addEventListener('scroll',()=>$('navbar').classList.toggle('scrolled',scrollY>50));startLive()});
